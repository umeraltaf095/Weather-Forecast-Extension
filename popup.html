<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
   <title>Weather Forecast</title>
</head>
<body>
    <h2 class="heading">Current Weather</h2>
    <button id="currentLocation">Current Location</button>
    <div>
        <label for="SelectCountry" class="locationOptions">Choose Country </label>
        <select id="selectCountry">
            <option disabled selected> Select Country</option>
        </select>
        
        <label for="SelectLocation" class="locationOptions">Choose city</label>
        <select id="selectLocation">
            <option disabled selected>Select city</option>
            
        </select>
    </div>
    <div>
        <div class="button-group">
            <button id="celsius" class="btn1">Celsius</button>
            <button id="fahrenheit" class="btn2">Fahrenheit</button>
        </div>
       <p>Temperature:</p>
       <p id="temp-value" class="temp"></p> 
       <br>
       <p>Min-Temp:</p>
       <p id="minTemp-value" class="temp"></p> 
       <br>
       <p>Max-Temp:</p>
       <p id="maxTemp-value" class="temp"></p> 
       <br>
       <p>Feels-like:</p>
       <p id="feelsLike-value" class="feelsLike"></p> 
       <br>
       <p>Humidity:</p>
       <p id="humidity-value" class="feelsLike"></p> 
       <br>
       <p>Wind Speed</p>
       <p id="windSpeed-value" class="feelsLike"></p> 
       <br>
       <p>Clouds:</p>
       <p id="clouds-value" class="feelsLike"></p> 
       
       </div>
    
    <script src="popup.js"></script>
</body>
</html>
